<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modificar Producto - InventarioPro</title>
  
  <!-- CSS Local de Bootstrap -->
  <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light p-4">

  <div class="container" style="max-width: 850px;">
    <!-- Breadcrumb de navegación -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">Panel de Control</a></li>
        <li class="breadcrumb-item"><a href="#" class="text-decoration-none">Productos</a></li>
        <li class="breadcrumb-item active" aria-current="page">Editar Producto</li>
      </ol>
    </nav>

    <!-- Título con Badge de SKU -->
    <div class="d-flex align-items-center gap-2 mb-4">
      <h2 class="fw-bold m-0">Modificar Producto</h2>
      <span class="badge bg-warning text-dark fs-6 rounded-pill px-3">SKU: PROD-001</span>
    </div>

    <!-- Formulario de Edición -->
    <div class="card shadow-sm border-0 p-4">
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Nombre del Producto</label>
            <input type="text" class="form-control" value="Teclado Mecánico RGB">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Código SKU</label>
            <!-- Campo de SKU bloqueado para preservar integridad de datos -->
            <input type="text" class="form-control bg-light" value="PROD-001" disabled readonly>
          </div>
        </div>

        <div class="row g-3 mt-2">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Categoría</label>
            <select class="form-select">
              <option selected>Periféricos</option>
              <option>Componentes</option>
              <option>Accesorios</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Etiqueta Visual</label>
            <div class="p-2 bg-primary rounded-1 w-100" style="height: 38px;"></div>
          </div>
        </div>

        <div class="mt-3">
          <label class="form-label fw-semibold small d-block">Disponibilidad</label>
          <div class="btn-group" role="group" aria-label="Disponibilidad del producto">
            <input type="radio" class="btn-check" name="dispModificar" id="modDisp1" checked>
            <label class="btn btn-outline-primary" for="modDisp1">En Stock</label>

            <input type="radio" class="btn-check" name="dispModificar" id="modDisp2">
            <label class="btn btn-outline-primary" for="modDisp2">Agotado</label>
          </div>
        </div>

        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-warning text-dark fw-semibold px-4">Actualizar Cambios</button>
          <a href="dashboard.html" class="btn btn-outline-secondary px-4">Cancelar</a>
        </div>
      </form>
    </div>
  </div>

  <!-- JS Local de Bootstrap -->
  <script src="plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
