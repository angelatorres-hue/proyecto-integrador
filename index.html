<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InventarioPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light p-3">

  <!-- VISTA 1: LOGIN -->
  <section id="v-login" class="container text-center py-5" style="max-width:400px">
    <div class="card shadow-sm border-0 p-4 rounded-4">
      <h3 class="fw-bold">Acceso</h3>
      <span class="badge bg-primary rounded-pill mb-3">Control de Usuarios</span>
      <form onsubmit="event.preventDefault(); show('v-dash')">
        <input type="text" class="form-control mb-2" value="admin@dominio.com" placeholder="Usuario" required>
        <input type="password" class="form-control mb-2" value="123456" placeholder="Contraseña" required>
        <div class="form-check text-start mb-3"><input type="checkbox" class="form-check-input" id="r"><label for="r" class="form-check-label small">Recordar sesión</label></div>
        <button class="btn btn-primary w-100 fw-bold">Ingresar al Panel</button>
      </form>
      <a href="#" onclick="show('v-reg')" class="small mt-3 d-block text-decoration-none">¿No tienes cuenta? Crear una</a>
    </div>
  </section>

  <!-- VISTA 2: REGISTRO -->
  <section id="v-reg" class="container d-none" style="max-width:500px">
    <div class="card shadow-sm border-0 p-4 rounded-4 text-center">
      <h3 class="fw-bold">Crear Cuenta</h3>
      <form onsubmit="event.preventDefault(); alert('¡Creada!'); show('v-login')" class="mt-3">
        <div class="row g-2 mb-2"><div class="col"><input class="form-control" placeholder="Nombre" required></div><div class="col"><input class="form-control" placeholder="Apellido" required></div></div>
        <input type="email" class="form-control mb-2" placeholder="Correo" required>
        <input type="password" class="form-control mb-3" placeholder="Contraseña" required>
        <button class="btn btn-success w-100 fw-bold">Registrar</button>
        <a href="#" onclick="show('v-login')" class="small mt-2 d-block text-muted">Volver al Login</a>
      </form>
    </div>
  </section>

  <!-- VISTA 3: DASHBOARD -->
  <section id="v-dash" class="container d-none" style="max-width:800px">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-bold m-0">Panel Operativo</h3>
      <button class="btn btn-outline-danger btn-sm" onclick="show('v-login')">Cerrar Sesión</button>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6"><div class="card p-3 border-0 shadow-sm"><small class="text-muted">Stock Total</small><h4 id="stock" class="m-0 fw-bold text-success">0</h4></div></div>
      <div class="col-6"><div class="card p-3 border-0 shadow-sm"><small class="text-muted">Avisos</small><h4 class="m-0 fw-bold text-warning">5 Críticos</h4></div></div>
    </div>
    <div class="card p-3 border-0 shadow-sm">
      <div class="d-flex justify-content-between mb-2">
        <h5 class="fw-bold m-0">Catálogo</h5>
        <button class="btn btn-primary btn-sm" onclick="abrirForm()">+ Nuevo Producto</button>
      </div>
      <table class="table align-middle m-0">
        <thead><tr><th>SKU</th><th>Producto</th><th>Categoría</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
        <tbody id="tbl"></tbody>
      </table>
    </div>
  </section>

  <!-- VISTA 4: FORMULARIO (CREAR / EDITAR) -->
  <section id="v-form" class="container d-none" style="max-width:600px">
    <h3 id="f-titulo" class="fw-bold mb-3">Producto</h3>
    <div class="card p-4 border-0 shadow-sm">
      <form onsubmit="guardar(event)">
        <div class="row g-2 mb-2">
          <div class="col"><label class="small fw-bold">Nombre</label><input type="text" id="f-nom" class="form-control" required></div>
          <div class="col"><label class="small fw-bold">SKU</label><input type="text" id="f-sku" class="form-control" required></div>
        </div>
        <div class="mb-2"><label class="small fw-bold">Categoría</label>
          <select id="f-cat" class="form-select"><option>Periféricos</option><option>Componentes</option><option>Soporte Técnico</option></select>
        </div>
        <div class="mb-3"><label class="small fw-bold d-block">Disponibilidad</label>
          <input type="radio" class="btn-check" name="f-disp" id="fd1" value="En Stock" checked><label class="btn btn-outline-primary btn-sm me-1" for="fd1">En Stock</label>
          <input type="radio" class="btn-check" name="f-disp" id="fd2" value="Agotado"><label class="btn btn-outline-primary btn-sm" for="fd2">Agotado</label>
        </div>
        <button class="btn btn-primary px-4 fw-bold">Guardar</button>
        <button type="button" class="btn btn-outline-secondary px-4" onclick="show('v-dash')">Cancelar</button>
      </form>
    </div>
  </section>

  <!-- VISTA 5: ELIMINAR -->
  <section id="v-del" class="container d-none" style="max-width:500px">
    <div class="alert alert-danger shadow-sm">Confirmación requerida para eliminar.</div>
    <div class="card p-3 border-0 shadow-sm mb-3" id="d-info"></div>
    <button class="btn btn-danger px-4" onclick="confirmarBorrar()">Confirmar y Eliminar</button>
    <button class="btn btn-secondary px-4" onclick="show('v-dash')">Cancelar</button>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let db = [
      { sku: 'PROD-001', nombre: 'Teclado Mecánico RGB', categoria: 'Periféricos', estado: 'En Stock' },
      { sku: 'PROD-002', nombre: 'Monitor 24 pulgadas', categoria: 'Componentes', estado: 'En Stock' }
    ], editIdx = null, delIdx = null, c = id => document.getElementById(id);

    function show(id) {
      document.querySelectorAll('section').forEach(s => s.classList.add('d-none'));
      c(id).classList.remove('d-none');
      if (id === 'v-dash') render();
    }

    function render() {
      c('tbl').innerHTML = db.map((p, i) => `
        <tr>
          <td class="fw-bold">${p.sku}</td><td>${p.nombre}</td><td>${p.categoria}</td>
          <td><span class="badge ${p.estado === 'En Stock' ? 'bg-success' : 'bg-danger'}">${p.estado}</span></td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-warning" onclick="abrirForm(${i})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="preBorrar(${i})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>`).join('');
      c('stock').innerText = db.length * 50;
    }

    function abrirForm(i = null) {
      editIdx = i;
      c('f-titulo').innerText = i !== null ? 'Modificar Producto' : 'Nuevo Producto';
      c('f-sku').readOnly = i !== null;
      c('f-sku').value = i !== null ? db[i].sku : '';
      c('f-nom').value = i !== null ? db[i].nombre : '';
      c('f-cat').value = i !== null ? db[i].categoria : 'Periféricos';
      c(i !== null && db[i].estado === 'Agotado' ? 'fd2' : 'fd1').checked = true;
      show('v-form');
    }

    function guardar(e) {
      e.preventDefault();
      const item = { sku: c('f-sku').value, nombre: c('f-nom').value, categoria: c('f-cat').value, estado: document.querySelector('input[name="f-disp"]:checked').value };
      if (editIdx !== null) db[editIdx] = item; else db.push(item);
      show('v-dash');
    }

    function preBorrar(i) { delIdx = i; c('d-info').innerHTML = `<b>SKU:</b> ${db[i].sku}<br><b>Producto:</b> ${db[i].nombre}`; show('v-del'); }
    function confirmarBorrar() { if(delIdx !== null) db.splice(delIdx, 1); show('v-dash'); }
  </script>
</body>
</html>
