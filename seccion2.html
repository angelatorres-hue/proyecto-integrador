<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - InventarioPro</title>
  
  <!-- CSS Local de Bootstrap -->
  <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light p-4">

  <div class="container-fluid">
    <!-- Breadcrumb de navegación -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#" class="text-decoration-none">Inicio</a></li>
        <li class="breadcrumb-item active" aria-current="page">Panel de Control</li>
      </ol>
    </nav>

    <!-- Alerta de bienvenida descartable -->
    <div class="alert alert-info alert-dismissible fade show shadow-sm" role="alert">
      Bienvenido al panel general del sistema.
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Título principal y botón con Badge de notificación -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold m-0">Panel Operativo</h2>
      <button class="btn btn-primary position-relative">
        Mensajes
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          4
        </span>
      </button>
    </div>

    <!-- Disposición en cuadrícula -->
    <div class="row g-4">
      <!-- Navegación Lateral / Menú -->
      <div class="col-md-3">
        <div class="list-group shadow-sm">
          <a href="dashboard.html" class="list-group-item list-group-item-action active text-center fw-semibold">Inicio</a>
          <a href="crear-producto.html" class="list-group-item list-group-item-action text-center">Productos</a>
          <a href="#" class="list-group-item list-group-item-action text-center">Usuarios</a>
        </div>
      </div>

      <!-- Tarjetas de Estado (Métricas) -->
      <div class="col-md-9">
        <div class="row g-3">
          <!-- Stock Disponible -->
          <div class="col-md-6">
            <div class="card shadow-sm border-0 p-3 h-100">
              <h5 class="card-title text-muted fs-6 mb-3">Stock Disponible</h5>
              <div>
                <span class="badge bg-success fs-6 px-3 py-2">120 Unidades</span>
              </div>
            </div>
          </div>
          
          <!-- Avisos Pendientes -->
          <div class="col-md-6">
            <div class="card shadow-sm border-0 p-3 h-100">
              <h5 class="card-title text-muted fs-6 mb-3">Avisos Pendientes</h5>
              <div>
                <span class="badge bg-warning text-dark fs-6 px-3 py-2">5 Críticos</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Local de Bootstrap -->
  <script src="plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
