<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Nueva Cuenta - InventarioPro</title>
  
  <!-- CSS Local de Bootstrap -->
  <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light p-4">

  <div class="container" style="max-width: 650px;">
    <!-- Breadcrumb superior -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-3">
        <li class="breadcrumb-item"><a href="#" class="text-decoration-none">Inicio</a></li>
        <li class="breadcrumb-item"><a href="login.html" class="text-decoration-none">Login</a></li>
        <li class="breadcrumb-item active" aria-current="page">Registro de Usuario</li>
      </ol>
    </nav>

    <!-- Alerta de Instrucción Descartable -->
    <div class="alert alert-info alert-dismissible fade show text-center shadow-sm mb-4" role="alert">
      <small>Complete el formulario para crear un nuevo usuario y acceder al sistema.</small>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Tarjeta de Formulario de Registro -->
    <div class="card shadow border-0 p-4 rounded-4">
      <div class="text-center mb-4">
        <h2 class="fw-bold m-0">Crear Nueva Cuenta</h2>
        <span class="badge bg-success rounded-pill px-3 mt-2">Nuevo Usuario</span>
      </div>

      <form>
        <!-- Nombres y Apellidos en dos columnas -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Nombres</label>
            <input type="text" class="form-control" placeholder="Juan" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Apellidos</label>
            <input type="text" class="form-control" placeholder="Pérez" required>
          </div>
        </div>

        <!-- Correo Electrónico con icono @ -->
        <div class="mb-3">
          <label class="form-label fw-semibold small">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary">@</span>
            <input type="email" class="form-control" placeholder="usuario@dominio.com" required>
          </div>
        </div>

        <!-- Contraseña y Confirmación en paralelo -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Contraseña</label>
            <input type="password" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Confirmar Contraseña</label>
            <input type="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <!-- Checkbox de Aceptación de Términos -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="terms" required>
          <label class="form-check-label small text-muted" for="terms">
            Acepto los términos y condiciones del sistema
          </label>
        </div>

        <!-- Botón Registrar Cuenta en Verde (Success) -->
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-success py-2 fw-semibold">Registrar Cuenta</button>
        </div>

        <!-- Enlace a Iniciar Sesión -->
        <div class="text-center small text-muted">
          already have an account? <a href="login.html" class="text-decoration-none fw-semibold">Iniciar Sesión</a>
        </div>
      </form>
    </div>
  </div>

  <!-- JS Local de Bootstrap -->
  <script src="plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
