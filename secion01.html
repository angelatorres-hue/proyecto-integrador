<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - InventarioPro</title>
  
  <!-- CSS Local de Bootstrap -->
  <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

  <div class="container" style="max-width: 420px;">
    <!-- Alerta Superior de Bienvenida Descartable -->
    <div class="alert alert-info alert-dismissible fade show text-center shadow-sm mb-3" role="alert">
      <small>Bienvenido. Ingrese sus credenciales.</small>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Tarjeta Centrada de Login -->
    <div class="card shadow border-0 p-4 rounded-4">
      <div class="text-center mb-3">
        <h2 class="fw-bold m-0">Acceso</h2>
        <span class="badge bg-primary rounded-pill px-3 mt-2">Control de Usuarios</span>
      </div>

      <form>
        <!-- Campo Correo / Usuario con Input-Group e ícono @ -->
        <div class="mb-3 text-start">
          <label class="form-label fw-semibold small">Correo / Usuario</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary">@</span>
            <input type="text" class="form-control" placeholder="usuario@dominio.com" required>
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="mb-3 text-start">
          <label class="form-label fw-semibold small">Contraseña</label>
          <input type="password" class="form-control" placeholder="••••••••" required>
        </div>

        <!-- Checkbox Recordar Sesión -->
        <div class="form-check mb-3 text-start">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label small text-muted" for="rememberMe">
            Recordar sesión en este equipo
          </label>
        </div>

        <!-- Botón de Ingreso -->
        <div class="d-grid mb-3">
          <a href="dashboard.html" class="btn btn-primary py-2 fw-semibold">Ingresar al Panel</a>
        </div>

        <!-- Enlaces a Registro e Inicio -->
        <div class="text-center">
          <a href="registro.html" class="text-decoration-none small d-block mb-1">¿No tienes cuenta? Crear una cuenta</a>
          <a href="#" class="text-decoration-none small text-secondary">Volver al Inicio</a>
        </div>
      </form>
    </div>
  </div>

  <!-- JS Local de Bootstrap -->
  <script src="plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
