<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Producto - InventarioPro</title>
  
  <!-- CSS Local de Bootstrap -->
  <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light p-4">

  <div class="container" style="max-width: 850px;">
    <!-- Breadcrumb de navegación -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">Panel de Control</a></li>
        <li class="breadcrumb-item active" aria-current="page">Registro de Producto</li>
      </ol>
    </nav>

    <!-- Encabezado con Título, Badge de Categoría y Botón de Retorno -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-2">
        <h2 class="fw-bold m-0">Nuevo Producto</h2>
        <span class="badge bg-secondary fs-6 rounded-pill px-3">Inventario</span>
      </div>
      <a href="dashboard.html" class="btn btn-outline-secondary btn-sm px-3">Volver al Panel</a>
    </div>

    <!-- Card de Formulario -->
    <div class="card shadow-sm border-0 p-4">
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Nombre del Producto</label>
            <input type="text" class="form-control" value="Teclado Mecánico RGB" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Código SKU</label>
            <input type="text" class="form-control" value="PROD-001" required>
          </div>
        </div>

        <div class="row g-3 mt-2">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Categorías Asignadas</label>
            <select class="form-select" multiple aria-label="Categorías Asignadas" style="height: 110px;">
              <option selected>Soporte Técnico</option>
              <option>Facturación</option>
              <option>Ventas</option>
              <option>Reclamos</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Etiqueta Visual</label>
            <div class="p-2 bg-primary rounded-1 w-100" style="height: 38px;"></div>
          </div>
        </div>

        <div class="mt-3">
          <label class="form-label fw-semibold small d-block">Disponibilidad Inicial</label>
          <div class="btn-group" role="group" aria-label="Disponibilidad inicial">
            <input type="radio" class="btn-check" name="disponibilidad" id="disp1" checked>
            <label class="btn btn-outline-primary" for="disp1">En Stock</label>

            <input type="radio" class="btn-check" name="disponibilidad" id="disp2">
            <label class="btn btn-outline-primary" for="disp2">Agotado</label>

            <input type="radio" class="btn-check" name="disponibilidad" id="disp3">
            <label class="btn btn-outline-primary" for="disp3">Descontinuado</label>
          </div>
        </div>

        <div class="form-check mt-3">
          <input class="form-check-input" type="checkbox" id="publicar" checked>
          <label class="form-check-label small" for="publicar">
            Publicar inmediatamente en el catálogo general
          </label>
        </div>

        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">Guardar Producto</button>
          <a href="dashboard.html" class="btn btn-outline-secondary px-4">Cancelar</a>
        </div>
      </form>
    </div>
  </div>

  <!-- JS Local de Bootstrap -->
  <script src="plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
